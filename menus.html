<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <title>MoreThanEDU</title>
    <link rel="icon" href="/static/img/favicon.png"/>
    <link rel="apple-touch-icon" href="/static/img/favicon.png"/>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .menu-overlay {
            position: fixed;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: #f4f4f4;
            box-shadow: -2px 0 5px rgba(0, 0, 0, 0.2);
            z-index: 1000;
        }

        .menu-header {
            display: flex;
            height: 60px;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background-color: rgb(15, 10, 84);
            color: white;
        }

        .menu-header h1 {
            margin: 0;
            font-size: 18px;
        }

        .close-menu {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .close-menu i {
            font-size: 24px;
        }

        .menu-body {
            display: flex;
            height: calc(100% - 60px);
        }

        .main-menu {
            width: 50%;
            border-right: 1px solid #ddd;
            padding: 20px;
            background-color: #f9f9f9;
        }

        .main-menu ul {
            list-style: none;
            padding: 0;
        }

        .main-menu li {
            margin-bottom: 15px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            color: #666;
            transition: color 0.3s ease;
        }

        .main-menu li.active {
            color: rgb(15, 10, 84);
        }

        .sub-menu {
            width: 50%;
            padding: 20px;
            overflow-y: auto;
        }

        .sub-menu ul {
            list-style: none;
            padding: 0;
        }

        .sub-menu li {
            margin-bottom: 10px;
            font-size: 14px;
            color: #333;
        }

        .sub-menu li a {
            text-decoration: none;
            color: #333;
        }

        .sub-menu.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="menu-overlay" id="menu">
        <div class="menu-header">
            <h1>모어댄에듀</h1>
            <button class="close-menu" onclick="history.back();"><i class="fas fa-times"></i></button>
        </div>
        <div class="menu-body">
            <div class="main-menu">
                <ul>
                    <li id="menu-about" class="active" onclick="selectMenu('about')">회사소개</li>
                    <li id="menu-business" onclick="selectMenu('business')">사업소개</li>
                    <li id="menu-promotion" onclick="selectMenu('promotion')">프로모션</li>
                    <li id="menu-support" onclick="selectMenu('support')">고객센터</li>
                </ul>
            </div>
            <div class="sub-menu" id="about">
                <ul>
                    <li><a href="/info/ceo">대표소개</a></li>
                    <li><a href="/info/vision">비전 및 경영철학</a></li>
                </ul>
            </div>
            <div class="sub-menu hidden" id="business">
                <ul>
                    <li><a href="/buis/Attendify">Attendify</a></li>
                </ul>
            </div>
            <div class="sub-menu hidden" id="promotion">
                <ul>
                    <li><a href="/promotions">프로모션</a></li>
                </ul>
            </div>
            <div class="sub-menu hidden" id="support">
                <ul>
                    <li><a href="/customer/notice">공지사항</a></li>
                    <li><a href="/customer/qna">자주하는질문</a></li>
                    <li><a href="/customer/inquiry">도입/견적문의</a></li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        function selectMenu(menuId) {
            // Highlight selected menu item
            document.querySelectorAll('.main-menu li').forEach(item => {
                item.classList.remove('active');
            });
            document.getElementById('menu-' + menuId).classList.add('active');

            // Show the corresponding submenu
            document.querySelectorAll('.sub-menu').forEach(menu => {
                menu.classList.add('hidden');
            });
            document.getElementById(menuId).classList.remove('hidden');
        }

        // Set default active menu on page load
        document.addEventListener('DOMContentLoaded', () => {
            selectMenu('about');
        });
    </script>

    <!-- Font Awesome for icons -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</body>
</html>
